name: Release

# Publishes to npm with provenance, so anyone can verify that a published
# version was built from this repository at a given commit. Runs only when
# started by hand. Before the first run, add this repository and workflow as a
# trusted publisher for @databuddy/scan on npmjs.com; no npm token is stored here.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Skip versions that are already published
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@databuddy/scan@$version" version >/dev/null 2>&1; then
            echo "Version $version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
